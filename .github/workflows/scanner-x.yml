name: Scanner-X

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch at a time; a newer push cancels the older run.
concurrency:
  group: scanner-x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # findings on the PR diff and in Security → Code scanning
      pull-requests: write # Scanner-X summary comment on each PR
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed to diff a PR against its base

      - uses: adarshm07/scanner@main
        with:
          fail-on: high
          report-url: https://adarshm07.github.io/scanner-x-demo/
          # On main, also build the report page for GitHub Pages.
          html-file: ${{ github.event_name != 'pull_request' && 'site/index.html' || '' }}
          # AI triage: add the provider key as a repository secret, then uncomment.
          # triage: gemini
        # env:
        #   GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # The demo app is vulnerable on purpose, so the policy fails on main.
      # Publish the report anyway.
      - uses: actions/upload-pages-artifact@v4
        if: always() && github.event_name != 'pull_request' && hashFiles('site/index.html') != ''
        with:
          path: site

  pages:
    needs: scan
    if: always() && github.event_name != 'pull_request' && needs.scan.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
